<!DOCTYPE html>
<html>
<head>
    <title>My Cloud Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        h1 { color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; width: 50%; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Cloud App</h1>
        <p>Deployed on AWS EC2</p>
        <p><strong>Database Status:</strong> <span id="db-status">Checking...</span></p>
    </div>
    <script>
        // This simulates an API call to our backend
        fetch('/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('db-status').innerText = data.database;
            })
            .catch(() => {
                document.getElementById('db-status').innerText = 'API Offline';
            });
    </script>
</body>
</html>
